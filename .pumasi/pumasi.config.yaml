pumasi:
  # ── 외주 워커 CLI 선택 (defaults.command 또는 task별 command 로 지정) ──
  # codex (기본) : "codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check"
  # grok         : "grok --no-auto-update --no-alt-screen --sandbox workspace --always-approve -p"
  #                # xAI Grok Build. 샌드박스가 기본 off라 workspace로 조이고, 자동 업데이터를 끈다.
  # gajae-code   : "gjc --print"                            # 멀티모델 코딩 CLI. 프롬프트가 --print 뒤 positional(MESSAGE)로 전달됨
  # antigravity  : "agy --dangerously-skip-permissions -p"  # Gemini CLI 후계 (디자인/UI)
  # ※ codex 외 CLI는 --output-schema 미지원 → report.json 없이 output.txt 기반 통합 (graceful)
  # ※ task별로 다른 command 지정 가능 → 모듈마다 다른 CLI에 병렬 외주
  defaults:
    command: "codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check"
    emoji: "🔍"

  tasks:
    - name: verify-react
      instruction: |
        URL 검증 — React.

        curl -ILs -o /dev/null -w "%{http_code}|%{url_effective}" "https://react.dev/llms.txt" 2>&1 명령으로 HTTP status + final URL 확인.

        결과를 /tmp/llms-verify/react.txt 에 다음 형식으로 저장:
        SERVICE: React
        ORIGINAL: https://react.dev/llms.txt
        STATUS: <http_code>
        FINAL: <url_effective>
        NOTES: <한 줄 비고 (redirect/404/timeout 등)>

        mkdir -p /tmp/llms-verify 먼저 실행.
      gates:
        - bash: "test -f /tmp/llms-verify/react.txt"
          label: "verify report exists"
    - name: verify-next-js
