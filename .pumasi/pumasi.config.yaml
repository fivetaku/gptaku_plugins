        RESULT: <FOUND|NOT_FOUND>
        URL: <found_url 또는 NONE>
        NOTES: <어떤 패턴에서 발견했는지>

        mkdir -p /tmp/llms-search 먼저 실행.
      gates:
        - bash: "test -f /tmp/llms-search/zilliz.txt"
          label: "search report exists"
