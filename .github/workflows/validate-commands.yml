name: validate-commands

# Regression gate: fail CI if any command lists AskUserQuestion under
# allowed-tools (Claude Code auto-approves it → the question UI never renders).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate command frontmatter
        run: python3 tools/validate_commands.py

      - name: Validate skill contracts
        run: python3 tools/validate_skill_contracts.py

      - name: Validate marketplace & plugin manifests
        run: python3 tools/validate_marketplace.py --check-releases

      # gptaku_doctor.py 자체는 로컬 설치 상태를 진단하므로 CI에서 못 돌린다.
      # 이 테스트는 가짜 HOME에 픽스처를 세워 축별 판정만 검증하므로 CI 가능.
      - name: Verify gptaku_doctor axis judgments (fault injection)
        run: python3 tools/test_gptaku_doctor.py
